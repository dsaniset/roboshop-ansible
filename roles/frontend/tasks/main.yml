- name: Start a container
  containers.podman.podman_container:
    name: Frontend
    image: public.ecr.aws/w8x4g9h7/roboshop-v3/frontend
    state: started
    restart: true
    restart_policy: "always"
    ports:
      - "8080:8080"
    env:
      CATALOGUE_HOST: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:CATALOGUE_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      CATALOGUE_PORT: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:CATALOGUE_PORT token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      USER_HOST: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:USER_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      USER_PORT: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:USER_PORT token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      CART_HOST: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:CART_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      CART_PORT: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:CART_PORT token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      SHIPPING_HOST: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:SHIPPING_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      SHIPPING_PORT: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:SHIPPING_PORT token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      PAYMENT_HOST: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:PAYMENT_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      PAYMENT_PORT: "{ proxy_pass {{ lookup('hashi_vault','roboshop-{{env}}/data/frontend:PAYMENT_PORT token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"