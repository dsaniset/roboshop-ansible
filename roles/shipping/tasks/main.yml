- name: Restart a container
  containers.podman.podman_container:
    name: Shipping
    image: public.ecr.aws/w8x4g9h7/roboshop-v3/shipping
    state: started
    restart: true
    restart_policy: "no"
    ports:
      - "8080:8080"
    env:
      CART_ENDPOINT: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:CART_ENDPOINT token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      DB_HOST: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:DB_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"

- name: Add schema
  loop:
    - app-user
    - schema
    - master-data
  containers.podman.podman_container:
    name: Shipping
    image: public.ecr.aws/w8x4g9h7/roboshop-v3/schema-load
    state: started
    restart: true
    restart_policy: "no"
    ports:
      - "8080:8080"
    env:
      DB_TYPE: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:DB_TYPE token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      APP_GIT_URL: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:APP_GIT_URL token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      DB_HOST: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:DB_HOST token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      DB_USER: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:DB_USER token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      DB_PASS: "{{ lookup('hashi_vault','roboshop-{{env}}/data/shipping:DB_PASS token={{vault_token}} url=http://vault-internal.kdevops23.online:8200')}}"
      SCHEMA_FILE: "db/{{ item }}.sql"